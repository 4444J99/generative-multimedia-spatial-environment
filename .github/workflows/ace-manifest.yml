name: Validate ACE boundaries
on:
  pull_request:
    paths:
      - ace-manifest.json
      - scripts/validate-ace-manifest.mjs
      - tests/ace-*.test.mjs
      - .github/workflows/ace-manifest.yml
      - js/**
  push:
    branches: [main]
    paths:
      - ace-manifest.json
      - scripts/validate-ace-manifest.mjs
      - tests/ace-*.test.mjs
      - .github/workflows/ace-manifest.yml
      - js/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identities:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: node scripts/validate-ace-manifest.mjs
      - run: node --test tests/ace-*.test.mjs
