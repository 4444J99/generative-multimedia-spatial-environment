name: Public source verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-source-${{ github.ref }}
  cancel-in-progress: true

# The deployment pipeline is manually disabled. Source checks need their own
# active, credential-free lane; runtime activation remains separately governed.
jobs:
  source:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npm run validate:package-lock
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm run test:publication
      - run: npm run validate:html

  browsers:
    name: Browser and accessibility tests (${{ matrix.project }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
          - project: firefox
          - project: Mobile Chrome
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      # Several specs launch Chromium directly, including in the Firefox project.
      - run: npx --no-install playwright install --with-deps chromium firefox
      - name: Provide an audio output for Firefox
        if: matrix.project == 'firefox'
        run: |
          sudo apt-get install --yes --no-install-recommends pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_audio rate=48000 channels=2
          pactl set-default-sink ci_audio
          test "$(pactl get-default-sink)" = ci_audio
          pactl info
          pactl list short sinks
      - run: npm test -- --project="${{ matrix.project }}"
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-source-browser-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  packaging:
    name: Public exhibit packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version: '24.19.0'
      - run: npm run test:publication
      - run: npm run build:exhibits
      - run: npm run stage:public
      - run: node scripts/verify-public-artifact.mjs
